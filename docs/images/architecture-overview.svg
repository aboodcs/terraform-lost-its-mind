<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3fb950"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a371f7"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#e87b00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" fill="url(#bg)" rx="12"/>
  <text x="500" y="35" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="bold" letter-spacing="2">TERRAFORM LOST ITS MIND — Architecture Overview</text>
  <text x="500" y="52" text-anchor="middle" fill="#8b949e" font-size="11">Oracle Cloud Infrastructure · VCN 10.0.0.0/16 · eu-amsterdam-1</text>
  <line x1="80" y1="62" x2="920" y2="62" stroke="#30363d" stroke-width="1"/>

  <!-- Internet -->
  <rect x="20" y="80" width="100" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="101" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">INTERNET</text>
  <text x="70" y="122" text-anchor="middle" fill="#58a6ff" font-size="20">🌐</text>

  <!-- OCI Region -->
  <rect x="160" y="70" width="820" height="640" rx="10" fill="#1a0800" fill-opacity="0.4" stroke="#e87b00" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="185" y="90" fill="#e87b00" font-size="10" font-weight="bold">OCI REGION: eu-amsterdam-1</text>

  <!-- VCN -->
  <rect x="175" y="100" width="790" height="597" rx="8" fill="#0c1a2e" fill-opacity="0.5" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="198" y="118" fill="#58a6ff" font-size="10" font-weight="bold">VCN  10.0.0.0/16</text>

  <!-- Internet Gateway -->
  <rect x="330" y="128" width="130" height="48" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="395" y="148" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">INTERNET GATEWAY</text>
  <text x="395" y="167" text-anchor="middle" fill="#58a6ff" font-size="14">⇄</text>

  <!-- NAT Gateway (paranoid only) -->
  <rect x="700" y="128" width="130" height="48" rx="8" fill="#1a0a2e" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="765" y="146" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">NAT GATEWAY</text>
  <text x="765" y="160" text-anchor="middle" fill="#a371f7" font-size="8">PARANOID ONLY</text>
  <text x="765" y="171" text-anchor="middle" fill="#484f58" font-size="8">Outbound for private subnet</text>

  <!-- Public Subnet -->
  <rect x="195" y="200" width="500" height="185" rx="8" fill="#0a1f0a" fill-opacity="0.6" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="220" y="218" fill="#3fb950" font-size="10" font-weight="bold">PUBLIC SUBNET  10.0.1.0/24</text>
  <text x="220" y="231" fill="#484f58" font-size="8">Route: 0.0.0.0/0 → IGW  |  prohibit_public_ip=false</text>

  <!-- NSG main -->
  <rect x="220" y="240" width="200" height="20" rx="4" fill="#0a1f0a" stroke="#3fb950" stroke-width="1"/>
  <text x="320" y="254" text-anchor="middle" fill="#3fb950" font-size="8">NSG main: SSH from var.allowed_ssh_cidr + HTTP/80 (normal)</text>

  <!-- Compute (public) -->
  <rect x="220" y="270" width="145" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="292" y="288" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">COMPUTE  ×1–2</text>
  <text x="292" y="308" text-anchor="middle" fill="#f0f6fc" font-size="20">🖥</text>
  <text x="292" y="330" text-anchor="middle" fill="#58a6ff" font-size="8">VM.Standard.E4.Flex</text>
  <text x="292" y="342" text-anchor="middle" fill="#484f58" font-size="8">2 OCPU / 16 GB / Oracle Linux 9</text>
  <text x="292" y="354" text-anchor="middle" fill="#3fb950" font-size="8">PUBLIC IP ✓  |  nginx on :80</text>
  <text x="292" y="365" text-anchor="middle" fill="#484f58" font-size="8">(Normal / Billionaire / Chaotic)</text>

  <!-- LB -->
  <rect x="395" y="270" width="145" height="100" rx="8" fill="#1a0a2e" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="467" y="288" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">LOAD BALANCER</text>
  <text x="467" y="308" text-anchor="middle" fill="#a371f7" font-size="20">⚖</text>
  <text x="467" y="328" text-anchor="middle" fill="#484f58" font-size="8">Flexible 10–10 Mbps</text>
  <text x="467" y="341" text-anchor="middle" fill="#484f58" font-size="8">NSG: public_entry (HTTP/80)</text>
  <text x="467" y="354" text-anchor="middle" fill="#484f58" font-size="8">Round-robin backend set</text>
  <text x="467" y="366" text-anchor="middle" fill="#a371f7" font-size="8">BILLIONAIRE ONLY</text>

  <!-- Private Subnet -->
  <rect x="195" y="408" width="500" height="180" rx="8" fill="#1a0a1a" fill-opacity="0.6" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="220" y="426" fill="#a371f7" font-size="10" font-weight="bold">PRIVATE SUBNET  10.0.2.0/24  — PARANOID MODE ONLY</text>
  <text x="220" y="439" fill="#484f58" font-size="8">Route: 0.0.0.0/0 → NAT GW  |  prohibit_public_ip=true</text>

  <!-- NSG private_app -->
  <rect x="220" y="447" width="230" height="20" rx="4" fill="#1a0a2e" stroke="#a371f7" stroke-width="1"/>
  <text x="335" y="461" text-anchor="middle" fill="#a371f7" font-size="8">NSG private_app: SSH from Bastion IP/32 + HTTP/80 from Bastion</text>

  <!-- Private Compute -->
  <rect x="220" y="475" width="145" height="100" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="292" y="493" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">COMPUTE  ×1</text>
  <text x="292" y="513" text-anchor="middle" fill="#f0f6fc" font-size="20">🖥</text>
  <text x="292" y="535" text-anchor="middle" fill="#58a6ff" font-size="8">VM.Standard.E4.Flex</text>
  <text x="292" y="547" text-anchor="middle" fill="#484f58" font-size="8">2 OCPU / 16 GB / Oracle Linux 9</text>
  <text x="292" y="559" text-anchor="middle" fill="#e87b00" font-size="8">NO PUBLIC IP  |  nginx on :80</text>

  <!-- OCI Bastion -->
  <rect x="395" y="475" width="145" height="100" rx="8" fill="#1a0800" stroke="#e87b00" stroke-width="1.5"/>
  <text x="467" y="493" text-anchor="middle" fill="#e87b00" font-size="9" font-weight="bold">OCI BASTION</text>
  <text x="467" y="513" text-anchor="middle" fill="#e87b00" font-size="18">🔐</text>
  <text x="467" y="533" text-anchor="middle" fill="#484f58" font-size="8">Type: STANDARD</text>
  <text x="467" y="546" text-anchor="middle" fill="#484f58" font-size="8">Client allow: allowed_ssh_cidr</text>
  <text x="467" y="559" text-anchor="middle" fill="#484f58" font-size="8">Target: private subnet</text>
  <text x="467" y="572" text-anchor="middle" fill="#e87b00" font-size="8">PARANOID ONLY</text>

  <!-- nginx / bootstrap info -->
  <rect x="720" y="200" width="235" height="110" rx="8" fill="#0a1f0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="837" y="220" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">Bootstrap (cloud-init)</text>
  <text x="737" y="238" fill="#484f58" font-size="8">• Wait for internet (6 × 10s retries)</text>
  <text x="737" y="252" fill="#484f58" font-size="8">• dnf/yum install nginx</text>
  <text x="737" y="266" fill="#484f58" font-size="8">• Write personality HTML to /usr/share/nginx/html/</text>
  <text x="737" y="280" fill="#484f58" font-size="8">• systemctl enable+restart nginx</text>
  <text x="737" y="294" fill="#484f58" font-size="8">• firewall-cmd --add-service=http (if active)</text>

  <!-- Outputs box -->
  <rect x="720" y="325" width="235" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="837" y="345" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Terraform Outputs</text>
  <text x="737" y="362" fill="#484f58" font-size="8">personality / personality_message</text>
  <text x="737" y="375" fill="#484f58" font-size="8">architecture_mode / instance_count</text>
  <text x="737" y="388" fill="#484f58" font-size="8">public_ips / private_ips / instance_ids</text>
  <text x="737" y="401" fill="#484f58" font-size="8">load_balancer_ip (billionaire → IP, else null)</text>
  <text x="737" y="414" fill="#484f58" font-size="8">application_url / website_url / website_urls</text>
  <text x="737" y="427" fill="#484f58" font-size="8">vcn_id / public_subnet_id / private_subnet_id</text>
  <text x="737" y="440" fill="#484f58" font-size="8">internet_gateway_id / network_security_group_id</text>

  <!-- Security List empty note -->
  <rect x="720" y="470" width="235" height="52" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="837" y="488" text-anchor="middle" fill="#484f58" font-size="9" font-weight="bold">Security List</text>
  <text x="837" y="504" text-anchor="middle" fill="#484f58" font-size="8">Intentionally empty — NSGs are the</text>
  <text x="837" y="518" text-anchor="middle" fill="#484f58" font-size="8">sole source of VNIC traffic rules</text>

  <!-- Tags note -->
  <rect x="720" y="540" width="235" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="837" y="558" text-anchor="middle" fill="#484f58" font-size="9" font-weight="bold">Freeform Tags (all resources)</text>
  <text x="837" y="574" text-anchor="middle" fill="#484f58" font-size="8">Project · Environment · Owner</text>
  <text x="837" y="588" text-anchor="middle" fill="#484f58" font-size="8">ManagedBy · CloudProvider · AutoDestroy</text>

  <!-- Arrows: Internet → IGW -->
  <line x1="120" y1="107" x2="328" y2="152" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="215" y="122" fill="#58a6ff" font-size="8">HTTP / SSH</text>

  <!-- IGW → Public Subnet -->
  <line x1="395" y1="176" x2="395" y2="198" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- IGW → NAT -->
  <line x1="460" y1="155" x2="698" y2="155" stroke="#a371f7" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrP)"/>
  <text x="575" y="148" fill="#a371f7" font-size="7">Paranoid outbound path</text>

  <!-- LB → Compute (billionaire) -->
  <line x1="395" y1="320" x2="367" y2="320" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrP)"/>

  <!-- Bastion → Private Compute -->
  <line x1="395" y1="525" x2="367" y2="525" stroke="#e87b00" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="380" y="515" text-anchor="middle" fill="#e87b00" font-size="7">SSH</text>

  <!-- Private Compute → NAT (outbound) -->
  <line x1="292" y1="475" x2="705" y2="155" stroke="#a371f7" stroke-width="0.8" stroke-dasharray="3,3" marker-end="url(#arrP)"/>

  <!-- Public Compute → nginx (implied) -->
  <line x1="292" y1="370" x2="292" y2="406" stroke="#3fb950" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrG)"/>

  <!-- Legend -->
  <rect x="20" y="430" width="150" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="95" y="448" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">LEGEND</text>
  <line x1="30" y1="460" x2="55" y2="460" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="60" y="464" fill="#58a6ff" font-size="8">Public HTTP/SSH</text>
  <line x1="30" y1="476" x2="55" y2="476" stroke="#3fb950" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrG)"/>
  <text x="60" y="480" fill="#3fb950" font-size="8">App traffic</text>
  <line x1="30" y1="492" x2="55" y2="492" stroke="#a371f7" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrP)"/>
  <text x="60" y="496" fill="#a371f7" font-size="8">Paranoid / outbound</text>
  <line x1="30" y1="508" x2="55" y2="508" stroke="#e87b00" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="60" y="512" fill="#e87b00" font-size="8">SSH via Bastion</text>
  <rect x="30" y="522" width="8" height="8" fill="none" stroke="#a371f7" stroke-dasharray="2,1"/>
  <text x="42" y="530" fill="#a371f7" font-size="8">Paranoid-only resources</text>
</svg>
