<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="fa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="url(#bgf)" rx="10"/>

  <!-- Step boxes -->
  <!-- 1: terraform.tfvars -->
  <rect x="30" y="120" width="130" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="95" y="148" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">terraform.tfvars</text>
  <text x="95" y="168" text-anchor="middle" fill="#484f58" font-size="9">budget</text>
  <text x="95" y="182" text-anchor="middle" fill="#484f58" font-size="9">security_level</text>
  <text x="95" y="196" text-anchor="middle" fill="#484f58" font-size="9">chaos_level</text>
  <text x="95" y="210" text-anchor="middle" fill="#484f58" font-size="9">environment</text>

  <!-- arrow -->
  <line x1="160" y1="170" x2="195" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- 2: variables.tf -->
  <rect x="200" y="130" width="130" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="265" y="155" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">variables.tf</text>
  <text x="265" y="174" text-anchor="middle" fill="#484f58" font-size="9">type + validation</text>
  <text x="265" y="189" text-anchor="middle" fill="#484f58" font-size="9">blocks on all inputs</text>

  <!-- arrow -->
  <line x1="330" y1="170" x2="365" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- 3: locals.tf -->
  <rect x="370" y="100" width="160" height="140" rx="8" fill="#1a0a2e" stroke="#a371f7" stroke-width="2"/>
  <text x="450" y="124" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">locals.tf</text>
  <text x="450" y="142" text-anchor="middle" fill="#484f58" font-size="8">personality decision engine</text>
  <text x="450" y="160" text-anchor="middle" fill="#484f58" font-size="8">is_paranoid = sec ≥ 80</text>
  <text x="450" y="175" text-anchor="middle" fill="#484f58" font-size="8">is_billionaire = personality</text>
  <text x="450" y="189" text-anchor="middle" fill="#484f58" font-size="8">  == "CLOUD BILLIONAIRE"</text>
  <text x="450" y="204" text-anchor="middle" fill="#484f58" font-size="8">instance_count = 1 or 2</text>
  <text x="450" y="220" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">→ Personality selected</text>

  <!-- arrow -->
  <line x1="530" y1="170" x2="565" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- 4: Resources box -->
  <rect x="570" y="80" width="155" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="647" y="102" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Resources</text>
  <text x="583" y="120" fill="#484f58" font-size="8">network.tf     VCN · subnets · IGW · NAT</text>
  <text x="583" y="134" fill="#484f58" font-size="8">security.tf    NSGs · Bastion</text>
  <text x="583" y="148" fill="#484f58" font-size="8">compute.tf     instances (count)</text>
  <text x="583" y="162" fill="#484f58" font-size="8">load-balancer  LB · backend set</text>
  <text x="583" y="176" fill="#484f58" font-size="8">cloud-init.tf  bootstrap + HTML</text>
  <text x="583" y="190" fill="#484f58" font-size="8">outputs.tf     IPs · URLs · mode</text>

  <!-- arrow -->
  <line x1="725" y1="170" x2="758" y2="170" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- 5: OCI -->
  <rect x="762" y="120" width="110" height="100" rx="8" fill="#1a0800" stroke="#e87b00" stroke-width="1.5"/>
  <text x="817" y="148" text-anchor="middle" fill="#e87b00" font-size="10" font-weight="bold">OCI</text>
  <text x="817" y="167" text-anchor="middle" fill="#e87b00" font-size="20">☁</text>
  <text x="817" y="192" text-anchor="middle" fill="#484f58" font-size="8">eu-amsterdam-1</text>
  <text x="817" y="206" text-anchor="middle" fill="#484f58" font-size="8">resources provisioned</text>

  <!-- Step labels under boxes -->
  <text x="95" y="235" text-anchor="middle" fill="#484f58" font-size="8">① Inputs</text>
  <text x="265" y="222" text-anchor="middle" fill="#484f58" font-size="8">② Validate</text>
  <text x="450" y="252" text-anchor="middle" fill="#484f58" font-size="8">③ Decide</text>
  <text x="647" y="272" text-anchor="middle" fill="#484f58" font-size="8">④ Plan resources</text>
  <text x="817" y="232" text-anchor="middle" fill="#484f58" font-size="8">⑤ Apply</text>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold" letter-spacing="1">HOW IT WORKS — Terraform Lifecycle</text>
  <line x1="60" y1="40" x2="840" y2="40" stroke="#30363d" stroke-width="1"/>
</svg>
