<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="c1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#58a6ff"/>
    </marker>
    <marker id="c2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a371f7"/>
    </marker>
    <marker id="c3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#e87b00"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg4)" rx="12"/>
  <text x="480" y="34" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="bold" letter-spacing="2">REQUEST FLOW — How Traffic Reaches nginx</text>
  <text x="480" y="52" text-anchor="middle" fill="#8b949e" font-size="11">HTTP and SSH access paths per personality mode</text>
  <line x1="60" y1="62" x2="900" y2="62" stroke="#30363d" stroke-width="1"/>

  <!-- Column separators and headers -->
  <line x1="320" y1="70" x2="320" y2="530" stroke="#30363d" stroke-width="1"/>
  <line x1="640" y1="70" x2="640" y2="530" stroke="#30363d" stroke-width="1"/>

  <rect x="22" y="75" width="276" height="28" rx="5" fill="#0c1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="160" y="93" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">NORMAL / BROKE / CHAOTIC</text>

  <rect x="342" y="75" width="276" height="28" rx="5" fill="#10071a" stroke="#a371f7" stroke-width="1.5"/>
  <text x="480" y="93" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">CLOUD BILLIONAIRE</text>

  <rect x="662" y="75" width="276" height="28" rx="5" fill="#1a0a2e" stroke="#a371f7" stroke-width="1.5"/>
  <text x="800" y="93" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">PARANOID ENGINEER</text>

  <!-- ===== COL 1: NORMAL ===== -->
  <!-- Browser -->
  <rect x="95" y="120" width="130" height="38" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="160" y="136" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">Browser</text>
  <text x="160" y="150" text-anchor="middle" fill="#58a6ff" font-size="12">💻</text>

  <line x1="160" y1="158" x2="160" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#c1)"/>
  <text x="175" y="176" fill="#58a6ff" font-size="8">HTTP GET /</text>

  <!-- IGW -->
  <rect x="95" y="190" width="130" height="30" rx="6" fill="#0c1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="160" y="209" text-anchor="middle" fill="#58a6ff" font-size="9">Internet Gateway</text>

  <line x1="160" y1="220" x2="160" y2="248" stroke="#58a6ff" stroke-width="2" marker-end="url(#c1)"/>

  <!-- NSG check -->
  <rect x="95" y="253" width="130" height="28" rx="5" fill="#0a1f0a" stroke="#3fb950" stroke-width="1"/>
  <text x="160" y="269" text-anchor="middle" fill="#3fb950" font-size="8">NSG main: allow HTTP/80</text>

  <line x1="160" y1="281" x2="160" y2="308" stroke="#58a6ff" stroke-width="2" marker-end="url(#c1)"/>

  <!-- Public IP -->
  <rect x="95" y="313" width="130" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="325" text-anchor="middle" fill="#f0f6fc" font-size="8">Public IP on VNIC</text>
  <text x="160" y="337" text-anchor="middle" fill="#3fb950" font-size="8">OCI routes to instance</text>

  <line x1="160" y1="341" x2="160" y2="370" stroke="#58a6ff" stroke-width="2" marker-end="url(#c1)"/>

  <!-- nginx -->
  <rect x="80" y="375" width="160" height="48" rx="7" fill="#0a1f0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="160" y="394" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">nginx :80</text>
  <text x="160" y="409" text-anchor="middle" fill="#484f58" font-size="8">Serves personality HTML</text>
  <text x="160" y="421" text-anchor="middle" fill="#484f58" font-size="8">Oracle Linux 9</text>

  <!-- SSH note col 1 -->
  <rect x="22" y="440" width="276" height="68" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="457" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">SSH Access</text>
  <text x="160" y="472" text-anchor="middle" fill="#484f58" font-size="8">Direct: ssh -i ~/.ssh/key opc@&lt;PUBLIC_IP&gt;</text>
  <text x="160" y="486" text-anchor="middle" fill="#484f58" font-size="8">NSG allows SSH from var.allowed_ssh_cidr only</text>
  <text x="160" y="500" text-anchor="middle" fill="#3fb950" font-size="8">URL: http://&lt;PUBLIC_IP&gt;</text>

  <!-- ===== COL 2: BILLIONAIRE ===== -->
  <!-- Browser -->
  <rect x="415" y="120" width="130" height="38" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="136" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">Browser</text>
  <text x="480" y="150" text-anchor="middle" fill="#58a6ff" font-size="12">💻</text>

  <line x1="480" y1="158" x2="480" y2="185" stroke="#a371f7" stroke-width="2" marker-end="url(#c2)"/>
  <text x="495" y="176" fill="#a371f7" font-size="8">HTTP GET /</text>

  <!-- IGW -->
  <rect x="415" y="190" width="130" height="30" rx="6" fill="#0c1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="480" y="209" text-anchor="middle" fill="#58a6ff" font-size="9">Internet Gateway</text>

  <line x1="480" y1="220" x2="480" y2="248" stroke="#a371f7" stroke-width="2" marker-end="url(#c2)"/>

  <!-- NSG public_entry -->
  <rect x="402" y="253" width="156" height="28" rx="5" fill="#10071a" stroke="#a371f7" stroke-width="1"/>
  <text x="480" y="266" text-anchor="middle" fill="#a371f7" font-size="8" font-weight="bold">NSG public_entry: HTTP/80</text>
  <text x="480" y="278" text-anchor="middle" fill="#484f58" font-size="7">Attached to Load Balancer</text>

  <line x1="480" y1="281" x2="480" y2="310" stroke="#a371f7" stroke-width="2" marker-end="url(#c2)"/>

  <!-- LB -->
  <rect x="410" y="315" width="140" height="40" rx="7" fill="#10071a" stroke="#a371f7" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">Load Balancer</text>
  <text x="480" y="347" text-anchor="middle" fill="#484f58" font-size="8">Round-robin  →  Backend Set</text>

  <!-- Two arrows to instances -->
  <line x1="450" y1="355" x2="415" y2="390" stroke="#a371f7" stroke-width="1.5" marker-end="url(#c2)"/>
  <line x1="510" y1="355" x2="545" y2="390" stroke="#a371f7" stroke-width="1.5" marker-end="url(#c2)"/>

  <!-- Instance-1 -->
  <rect x="352" y="395" width="110" height="48" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="407" y="412" text-anchor="middle" fill="#8b949e" font-size="8" font-weight="bold">Instance-1</text>
  <text x="407" y="426" text-anchor="middle" fill="#3fb950" font-size="8">nginx :80</text>
  <text x="407" y="440" text-anchor="middle" fill="#484f58" font-size="7">NSG main: HTTP from LB NSG</text>

  <!-- Instance-2 -->
  <rect x="498" y="395" width="110" height="48" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="553" y="412" text-anchor="middle" fill="#8b949e" font-size="8" font-weight="bold">Instance-2</text>
  <text x="553" y="426" text-anchor="middle" fill="#3fb950" font-size="8">nginx :80</text>
  <text x="553" y="440" text-anchor="middle" fill="#484f58" font-size="7">NSG main: HTTP from LB NSG</text>

  <!-- Billionaire note -->
  <rect x="342" y="458" width="276" height="62" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="475" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">SSH Access</text>
  <text x="480" y="490" text-anchor="middle" fill="#484f58" font-size="8">Direct to instance public IPs (NSG main allows SSH from cidr)</text>
  <text x="480" y="505" text-anchor="middle" fill="#a371f7" font-size="8">URL: http://&lt;LOAD_BALANCER_IP&gt;</text>

  <!-- ===== COL 3: PARANOID ===== -->
  <!-- User with terminal -->
  <rect x="730" y="120" width="140" height="38" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="136" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">Engineer's Terminal</text>
  <text x="800" y="150" text-anchor="middle" fill="#e87b00" font-size="12">🔒</text>

  <line x1="800" y1="158" x2="800" y2="185" stroke="#e87b00" stroke-width="2" marker-end="url(#c3)"/>
  <text x="820" y="175" fill="#e87b00" font-size="8">ssh -L 8080:&lt;PRIV_IP&gt;:80</text>

  <!-- OCI Bastion -->
  <rect x="730" y="190" width="140" height="40" rx="7" fill="#1a0800" stroke="#e87b00" stroke-width="1.5"/>
  <text x="800" y="207" text-anchor="middle" fill="#e87b00" font-size="9" font-weight="bold">OCI Bastion</text>
  <text x="800" y="222" text-anchor="middle" fill="#484f58" font-size="7">Validates client CIDR  ·  Port-forward session</text>

  <line x1="800" y1="230" x2="800" y2="258" stroke="#e87b00" stroke-width="2" marker-end="url(#c3)"/>
  <text x="820" y="248" fill="#e87b00" font-size="8">Tunnelled SSH</text>

  <!-- NSG private_app -->
  <rect x="718" y="263" width="164" height="28" rx="5" fill="#1a0a2e" stroke="#a371f7" stroke-width="1"/>
  <text x="800" y="276" text-anchor="middle" fill="#a371f7" font-size="8" font-weight="bold">NSG private_app</text>
  <text x="800" y="288" text-anchor="middle" fill="#484f58" font-size="7">SSH + HTTP from Bastion IP/32 only</text>

  <line x1="800" y1="291" x2="800" y2="318" stroke="#e87b00" stroke-width="2" marker-end="url(#c3)"/>

  <!-- Private Instance -->
  <rect x="725" y="323" width="150" height="60" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="800" y="340" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">Instance (Private)</text>
  <text x="800" y="355" text-anchor="middle" fill="#e87b00" font-size="8">NO PUBLIC IP</text>
  <text x="800" y="368" text-anchor="middle" fill="#3fb950" font-size="8">nginx :80</text>
  <text x="800" y="381" text-anchor="middle" fill="#484f58" font-size="7">Private subnet 10.0.2.0/24</text>

  <!-- Browser → localhost tunnel -->
  <line x1="800" y1="383" x2="800" y2="410" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#c2)"/>

  <!-- localhost tunnel -->
  <rect x="710" y="415" width="180" height="28" rx="5" fill="#0a1a0a" stroke="#3fb950" stroke-width="1"/>
  <text x="800" y="429" text-anchor="middle" fill="#3fb950" font-size="8">localhost:8080  →  nginx response</text>

  <!-- Paranoid note -->
  <rect x="662" y="455" width="296" height="72" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="472" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">Bastion Port-Forward Command</text>
  <text x="670" y="488" fill="#484f58" font-size="8">ssh -i ~/.ssh/id_ed25519 -N \</text>
  <text x="670" y="502" fill="#484f58" font-size="8">  -L 8080:&lt;PRIVATE_IP&gt;:80 -p 22 \</text>
  <text x="670" y="516" fill="#484f58" font-size="8">  &lt;SESSION_OCID&gt;@host.bastion.&lt;REGION&gt;.oci.oraclecloud.com</text>
</svg>
