<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#58a6ff"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a371f7"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#e87b00"/>
    </marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3fb950"/>
    </marker>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#f78166"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="url(#bg2)" rx="12"/>
  <text x="450" y="34" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="bold" letter-spacing="2">PERSONALITY ENGINE — Decision Tree</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="11">How Terraform variables select infrastructure personality (locals.tf)</text>
  <line x1="60" y1="62" x2="840" y2="62" stroke="#30363d" stroke-width="1"/>

  <!-- Input block -->
  <rect x="320" y="80" width="260" height="100" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">User Inputs (terraform.tfvars)</text>
  <text x="450" y="120" text-anchor="middle" fill="#484f58" font-size="9">budget          (number ≥ 0)</text>
  <text x="450" y="135" text-anchor="middle" fill="#484f58" font-size="9">security_level  (0–100)</text>
  <text x="450" y="150" text-anchor="middle" fill="#484f58" font-size="9">chaos_level     (0–100)</text>
  <text x="450" y="165" text-anchor="middle" fill="#484f58" font-size="9">environment     (dev | test | staging)</text>

  <!-- Arrow down to decision 1 -->
  <line x1="450" y1="180" x2="450" y2="210" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Decision 1: budget < 20? -->
  <polygon points="450,215 570,255 450,295 330,255" fill="#1a0800" stroke="#f78166" stroke-width="2"/>
  <text x="450" y="248" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">budget &lt; 20 ?</text>
  <text x="450" y="263" text-anchor="middle" fill="#484f58" font-size="8">condition 1 — evaluated first</text>

  <!-- YES → Broke Student -->
  <line x1="330" y1="255" x2="180" y2="255" stroke="#f78166" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="248" y="247" text-anchor="middle" fill="#f78166" font-size="9">YES</text>
  <rect x="50" y="225" width="130" height="62" rx="8" fill="#1a0800" stroke="#f78166" stroke-width="1.5"/>
  <text x="115" y="245" text-anchor="middle" fill="#f78166" font-size="10" font-weight="bold">BROKE STUDENT</text>
  <text x="115" y="260" text-anchor="middle" fill="#484f58" font-size="8">1 instance, public</text>
  <text x="115" y="273" text-anchor="middle" fill="#484f58" font-size="8">No LB, no Bastion</text>
  <text x="115" y="286" text-anchor="middle" fill="#f78166" font-size="8">"We are NOT paying for that."</text>

  <!-- NO → down to D2 -->
  <line x1="450" y1="295" x2="450" y2="330" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="462" y="315" fill="#8b949e" font-size="9">NO</text>

  <!-- Decision 2: security_level >= 80? -->
  <polygon points="450,335 570,375 450,415 330,375" fill="#1a0a2e" stroke="#a371f7" stroke-width="2"/>
  <text x="450" y="368" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">security_level ≥ 80 ?</text>
  <text x="450" y="383" text-anchor="middle" fill="#484f58" font-size="8">condition 2</text>

  <!-- YES → Paranoid -->
  <line x1="330" y1="375" x2="180" y2="375" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="248" y="367" text-anchor="middle" fill="#a371f7" font-size="9">YES</text>
  <rect x="50" y="345" width="130" height="72" rx="8" fill="#1a0a2e" stroke="#a371f7" stroke-width="1.5"/>
  <text x="115" y="365" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">PARANOID ENGINEER</text>
  <text x="115" y="380" text-anchor="middle" fill="#484f58" font-size="8">1 instance, private subnet</text>
  <text x="115" y="393" text-anchor="middle" fill="#484f58" font-size="8">OCI Bastion + NAT GW</text>
  <text x="115" y="406" text-anchor="middle" fill="#484f58" font-size="8">No public IP</text>
  <text x="115" y="417" text-anchor="middle" fill="#a371f7" font-size="8">"I don't trust the Internet."</text>

  <!-- NO → down to D3 -->
  <line x1="450" y1="415" x2="450" y2="450" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="462" y="435" fill="#8b949e" font-size="9">NO</text>

  <!-- Decision 3: budget >= 500? -->
  <polygon points="450,455 570,495 450,535 330,495" fill="#10071a" stroke="#a371f7" stroke-width="2"/>
  <text x="450" y="488" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">budget ≥ 500 ?</text>
  <text x="450" y="503" text-anchor="middle" fill="#484f58" font-size="8">condition 3</text>

  <!-- YES → Cloud Billionaire -->
  <line x1="330" y1="495" x2="180" y2="495" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="248" y="487" text-anchor="middle" fill="#a371f7" font-size="9">YES</text>
  <rect x="50" y="462" width="130" height="72" rx="8" fill="#10071a" stroke="#a371f7" stroke-width="1.5"/>
  <text x="115" y="482" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="bold">CLOUD BILLIONAIRE</text>
  <text x="115" y="497" text-anchor="middle" fill="#484f58" font-size="8">2 instances, public</text>
  <text x="115" y="510" text-anchor="middle" fill="#484f58" font-size="8">OCI Load Balancer</text>
  <text x="115" y="523" text-anchor="middle" fill="#484f58" font-size="8">Round-robin, :80</text>
  <text x="115" y="534" text-anchor="middle" fill="#a371f7" font-size="8">"Availability first."</text>

  <!-- NO → down to D4 -->
  <line x1="450" y1="535" x2="450" y2="570" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="462" y="555" fill="#8b949e" font-size="9">NO</text>

  <!-- Decision 4: chaos_level >= 80? -->
  <polygon points="450,575 570,610 450,645 330,610" fill="#0a1a0a" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="603" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">chaos_level ≥ 80 ?</text>
  <text x="450" y="618" text-anchor="middle" fill="#484f58" font-size="8">condition 4</text>

  <!-- YES → Chaotic -->
  <line x1="330" y1="610" x2="180" y2="610" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="248" y="602" text-anchor="middle" fill="#3fb950" font-size="9">YES</text>
  <rect x="50" y="580" width="130" height="62" rx="8" fill="#0a1a0a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="115" y="600" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">CHAOTIC</text>
  <text x="115" y="615" text-anchor="middle" fill="#484f58" font-size="8">1 instance, public</text>
  <text x="115" y="628" text-anchor="middle" fill="#484f58" font-size="8">No LB, no Bastion</text>
  <text x="115" y="641" text-anchor="middle" fill="#3fb950" font-size="8">"I provision therefore I am."</text>

  <!-- NO → Normal -->
  <line x1="570" y1="610" x2="720" y2="610" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="642" y="602" text-anchor="middle" fill="#8b949e" font-size="9">NO</text>
  <rect x="720" y="580" width="130" height="62" rx="8" fill="#0c1a2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="785" y="600" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">NORMAL ENGINEER</text>
  <text x="785" y="615" text-anchor="middle" fill="#484f58" font-size="8">1 instance, public</text>
  <text x="785" y="628" text-anchor="middle" fill="#484f58" font-size="8">No LB, no Bastion</text>
  <text x="785" y="641" text-anchor="middle" fill="#58a6ff" font-size="8">"Let's build something reasonable."</text>

  <!-- Right side note -->
  <rect x="720" y="80" width="160" height="165" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="100" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Precedence Order</text>
  <text x="735" y="118" fill="#f78166" font-size="9">① budget &lt; 20  →  BROKE</text>
  <text x="735" y="135" fill="#a371f7" font-size="9">② sec ≥ 80    →  PARANOID</text>
  <text x="735" y="152" fill="#a371f7" font-size="9">③ budget ≥ 500 →  BILLIONAIRE</text>
  <text x="735" y="169" fill="#3fb950" font-size="9">④ chaos ≥ 80  →  CHAOTIC</text>
  <text x="735" y="186" fill="#58a6ff" font-size="9">⑤ (default)   →  NORMAL</text>
  <line x1="735" y1="196" x2="870" y2="196" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="212" text-anchor="middle" fill="#484f58" font-size="8">First match wins.</text>
  <text x="800" y="226" text-anchor="middle" fill="#484f58" font-size="8">Example: budget=10, sec=90</text>
  <text x="800" y="240" text-anchor="middle" fill="#f78166" font-size="8">→ BROKE (not PARANOID)</text>

  <!-- is_paranoid note -->
  <rect x="720" y="260" width="160" height="55" rx="8" fill="#1a0a2e" stroke="#a371f7" stroke-width="1"/>
  <text x="800" y="278" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">is_paranoid</text>
  <text x="800" y="294" text-anchor="middle" fill="#484f58" font-size="8">security_level ≥ 80</text>
  <text x="800" y="308" text-anchor="middle" fill="#484f58" font-size="8">Drives network_mode = "private"</text>

  <!-- is_billionaire note -->
  <rect x="720" y="330" width="160" height="55" rx="8" fill="#10071a" stroke="#a371f7" stroke-width="1"/>
  <text x="800" y="348" text-anchor="middle" fill="#a371f7" font-size="9" font-weight="bold">is_billionaire</text>
  <text x="800" y="364" text-anchor="middle" fill="#484f58" font-size="8">personality == "CLOUD BILLIONAIRE"</text>
  <text x="800" y="378" text-anchor="middle" fill="#484f58" font-size="8">Drives instance_count = 2, LB</text>

  <!-- instance_count note -->
  <rect x="720" y="400" width="160" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="800" y="418" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="bold">instance_count</text>
  <text x="800" y="434" text-anchor="middle" fill="#484f58" font-size="8">Billionaire → 2</text>
  <text x="800" y="448" text-anchor="middle" fill="#484f58" font-size="8">All others → 1  (max capped at 3)</text>
</svg>
